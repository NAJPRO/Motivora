name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw -B clean compile

      - name: Unit tests
        run: ./mvnw -B test

      # The runner ships a Docker daemon, so Testcontainers can start PostgreSQL and the
      # HTTP contract tests run against the real schema, migrations included.
      - name: Integration tests
        run: ./mvnw -B verify -Pintegration-tests

      - name: Package
        run: ./mvnw -B package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: motivora-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Builds the image without publishing it: catches a broken Dockerfile before release.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: motivora:ci
